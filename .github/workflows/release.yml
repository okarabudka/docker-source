name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ["8.1", "8.2", "8.3", "8.4", "8.5"]
    env:
      PHP_VERSIONS: ${{ matrix.version }}
      GHA_CACHE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # PECL downloads fail now and then; one retry continues from the cache.
      - name: Build (amd64)
        id: build
        continue-on-error: true
        uses: docker/bake-action@v7
        with:
          source: .
          load: true
      - name: Build (amd64, retry)
        if: steps.build.outcome == 'failure'
        uses: docker/bake-action@v7
        with:
          source: .
          load: true
      - name: Smoke tests
        run: make test VERSIONS=${{ matrix.version }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (amd64 + arm64)
        uses: docker/bake-action@v7
        env:
          RELEASE: ${{ github.ref_name }}
        with:
          source: .
          push: true
          set: |
            *.platform=linux/amd64,linux/arm64
