; Xdebug is loaded but off; set XDEBUG_MODE (e.g. debug, coverage) to enable it.
xdebug.mode = off
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal

; mail() goes to an SMTP catcher such as Mailpit.
sendmail_path = "/usr/bin/msmtp --host=${MAIL_HOST} --port=${MAIL_PORT} --from=app@localhost -t"
